[package]
name = "corridor-zcash-frost"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FROST 2-of-3 threshold signing for Corridor's Zcash Ironwood treasury (RedPallas, rerandomized)"

[[bin]]
name = "corridor-frost"
path = "src/main.rs"

# Versions pinned to what zcash-devtool (the wallet side of the flow) resolves,
# so PCZTs round-trip between the two tools byte-for-byte.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ff = "0.13"
frost-rerandomized = "=3.0.0"
hex = "0.4"
orchard = { version = "=0.15.3", default-features = false, features = ["std"] }
pasta_curves = "0.5.1"
pczt = { version = "=0.9.3", features = ["orchard", "signer"] }
rand = "0.8"
reddsa = { version = "=0.5.2", features = ["frost"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_keys = { version = "=0.16.1", default-features = false, features = ["orchard", "unstable-frost"] }
zcash_protocol = "0.10.5"
